baseURL: https://heruos.top/
languageCode: "zh"
DefaultContentLanguage: "zh"
title: Rainux
theme: ["PaperMod"]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["post", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 10

languages:
  zh:
    languageName: "中文"
    weight: 10
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: 归档
          url: archives
          weight: 5
        - name: 分类
          url: categories/
          weight: 7
    #     - name: 搜索
    #       url: search/
    #       weight: 10
        - name: 标签
          url: tags/
          weight: 10
        - name: 关于
          url: about
          weight: 15
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Archives
          url: archives
          weight: 5
        - name: Categories
          url: categories/
          weight: 7
    #     - name: Search
    #       url: search/
    #       weight: 10
        - name: Tags
          url: tags/
          weight: 10
        - name: About
          url: about
          weight: 15

markup:
  highlight:
    lineNos: true
    tabWidth: 4

outputs:
  home:
  - html
  - rss
  page:
  - html
  rss:
  - rss
  section:
  - html
  - rss
  taxonomy:
  - html
  - rss
  term:
  - html
  - rss

services:
  rss:
    limit: 10

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Getting Over it with Rainux."
  author: Rainux He

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  hasMermaid: false

  homeInfoParams:
    Title: "Rainux || Heruos || 花酒锄作田"
    Content: |
      忘了是怎么开始，也许就是对于写点什么比较感兴趣

      记录生活，记录工作；记录风景，记录走过的路

      爱过的、痛过的、念想过的、遗憾过的

      还不算长的岁月里也有很多值得回忆的事物

      坦然接受过去，一点一滴都成就现在的自己

      平淡展望未来，一步一脚印走向希冀的远方

      我来过，我记录

      我记录，我将来